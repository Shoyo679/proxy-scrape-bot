# Builds ProxyScrapeBot.exe on every version tag (v0.1.0, ...) and attaches it to the GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - run: pyinstaller --onefile --noconsole --name ProxyScrapeBot --icon assets/icon.ico --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets" --collect-data tzdata --hidden-import tzlocal --hidden-import pystray._win32 run.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ProxyScrapeBot.exe
